<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#131028" />
<link rel="icon" href="data:,">
<title>来自星际的来信 · 收信站｜DIMENSION ANCHOR</title>
<meta name="description" content="收信站：今日星笺、未读与历史来信，来自你设定的角色。信件保存在你自己的档案里。" />
<link rel="preload" as="image" href="assets/media/post/incoming-hall.jpg" />
<link rel="stylesheet" href="assets/css/post.css?v=20261108d" />
<link rel="stylesheet" href="assets/css/ambient.css?v=20261108d" />
</head>
<body>

<div class="scene" aria-hidden="true">
  <img class="scene__img" src="assets/media/post/incoming-hall.jpg" alt="" />
  <video class="scene__light" autoplay muted loop playsinline preload="auto"
         poster="assets/media/post/incoming-hall.jpg" src="assets/media/post/incoming-hall.mp4"></video>
  <div class="amb-dust" aria-hidden="true"></div>
  <div class="scene__veil"></div>
</div>

<!-- 飘动的信笺：收信站里，信件正在飞向收信人 -->
<span class="amb-letter amb-letter--1" aria-hidden="true">
  <svg viewBox="0 0 40 30"><rect class="amb-env-body" x="1" y="1" width="38" height="28" rx="3"/><path class="amb-env-line" d="M2 4 20 18 38 4"/></svg>
</span>
<span class="amb-letter amb-letter--2" aria-hidden="true">
  <svg viewBox="0 0 40 30"><rect class="amb-env-body" x="1" y="1" width="38" height="28" rx="3"/><path class="amb-env-line" d="M2 4 20 18 38 4"/></svg>
</span>
<span class="amb-letter amb-letter--3" aria-hidden="true">
  <svg viewBox="0 0 40 30"><rect class="amb-env-body" x="1" y="1" width="38" height="28" rx="3"/><path class="amb-env-line" d="M2 4 20 18 38 4"/></svg>
</span>

<header class="nav">
  <a class="brand" href="hall-motion.html" aria-label="返回星轨大厅">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="1" opacity=".5"/>
      <path d="M37.8 9.6a23 23 0 1 0 0 44.8 19.4 19.4 0 1 1 0-44.8Z" fill="currentColor" opacity=".9"/>
      <path d="M43.6 32 45.6 37.6 51.2 39.6 45.6 41.6 43.6 47.2 41.6 41.6 36 39.6 41.6 37.6Z" fill="#FFF8E6" opacity=".9"/>
    </svg>
    <span>DIMENSION<br />ANCHOR</span>
  </a>
  <nav class="nav__links" aria-label="通讯局">
    <a href="post.html">通讯局</a>
    <span class="here" aria-current="page">收信站</span>
    <a href="outgoing.html">寄信站</a>
  </nav>
  <span class="nav__mode" id="modeChip" hidden><i class="dot"></i><span id="modeText"></span></span>
</header>

<main>
  <section class="sp-head">
    <div>
      <p class="eyebrow">INCOMING LETTERS</p>
      <h1>来自星际的来信</h1>
      <p class="sp-head__lede">每天一封星笺，也可以随时请角色再写一封。信件由 AI 依角色档案、你们的关系与你此刻的心意创作，读过的会安静落进信匣。</p>
      <div class="sp-head__acts">
        <button class="btn btn--plate" id="btnDaily" type="button"><i class="dot" aria-hidden="true"></i><span id="btnDailyText">领取今日来信</span></button>
        <a class="btn btn--quiet" href="outgoing.html">去写一封回信</a>
      </div>
    </div>
    <div class="glass daily-card" id="dailyCard">
      <p class="daily-card__dt">今日星笺</p>
      <p class="daily-card__theme" id="dailyTheme">—</p>
      <p class="daily-card__sub" id="dailySub">今天还没有你的信。</p>
      <div class="daily-card__acts" id="dailyActs" hidden>
        <button class="btn btn--plate" id="dailyOpen" type="button">重新读这封信</button>
        <button class="btn btn--quiet" id="dailyFresh" type="button">再收一封</button>
      </div>
    </div>
  </section>

  <section class="sp-body drawer">
    <div class="drawer__bar">
      <div class="chips" id="chips">
        <button type="button" data-f="all" class="is-on">全部</button>
        <button type="button" data-f="unread">未读</button>
        <button type="button" data-f="faved">已珍藏</button>
      </div>
      <div class="drawer__sels">
        <select id="fChar" aria-label="按角色筛选"><option value="">全部角色</option></select>
        <select id="fType" aria-label="按类型筛选"><option value="">全部类型</option></select>
      </div>
    </div>
    <div class="letter-grid" id="grid" aria-live="polite"></div>
  </section>
</main>

<footer class="pt-foot">
  <span aria-hidden="true">✦</span> 收信厅的灯，为每一封信亮着。 <span aria-hidden="true">✦</span>
</footer>

<!-- 阅读器 -->
<div class="overlay" id="reader" hidden>
  <div class="overlay__scrim" data-close></div>
  <div class="overlay__stage">
    <article class="paper" id="paper">
      <img class="paper__corner paper__corner--tl" src="assets/media/post/ornament-corner.png" alt="" aria-hidden="true" />
      <img class="paper__corner paper__corner--tr" src="assets/media/post/ornament-corner.png" alt="" aria-hidden="true" />
      <img class="paper__corner paper__corner--bl" src="assets/media/post/ornament-corner.png" alt="" aria-hidden="true" />
      <img class="paper__corner paper__corner--br" src="assets/media/post/ornament-corner.png" alt="" aria-hidden="true" />
      <img class="paper__flourish" src="assets/media/post/flourish.png" alt="" aria-hidden="true" />
      <p class="paper__kind" id="pKind"></p>
      <h2 class="paper__title" id="pTitle"></h2>
      <p class="paper__greet" id="pGreet"></p>
      <div class="paper__body" id="pBody"></div>
      <p class="paper__sign" id="pSign"></p>
      <p class="paper__meta" id="pMeta"></p>
      <div class="deck" id="deck" hidden>
        <button class="deck__bar" id="deckBar" type="button" aria-expanded="false" aria-controls="deckBody">
          <span class="deck__hint" id="deckHint"></span>
          <img class="deck__chev" src="assets/media/post/select-arrow.webp" alt="" aria-hidden="true">
        </button>
        <div class="deck__tray" id="deckBody" hidden>
          <div class="deck__row" id="deckRow"></div>
          <p class="deck__note">牌只决定这封信从哪里开始写，句子仍然是 TA 自己的。</p>
        </div>
      </div>
    </article>
    <div class="reader__acts" id="readerActs">
      <button class="btn btn--plate" id="actFav" type="button">珍藏这封信</button>
      <button class="btn btn--quiet" id="actReply" type="button">写一封回信</button>
      <button class="btn btn--quiet" id="actDel" type="button">删除</button>
      <button class="btn btn--quiet" id="actBack" type="button" data-close>返回收信站</button>
    </div>
  </div>
</div>

<!-- 领取来信对话框 -->
<div class="dialog" id="dlg" hidden>
  <div class="overlay__scrim" data-close></div>
  <div class="dialog__box" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <button class="dialog__x" type="button" data-close aria-label="关闭">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 12.5 12.5M12.5 3.5 3.5 12.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
    </button>
    <p class="dialog__step" id="dlgStep">STELLAR MAIL</p>
    <h2 class="dialog__title" id="dlgTitle">领取今日来信</h2>
    <div id="dlgBody"></div>
    <div class="dialog__foot" id="dlgFoot">
      <button class="btn btn--quiet" type="button" data-close>取消</button>
      <button class="btn btn--plate" type="button" id="dlgGo">请 TA 落笔</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/js/da-link.js"></script>
<script src="assets/js/da-store.js"></script>
<script src="assets/js/tarot-deck.js"></script>
<script src="assets/js/tarot-art.js"></script>
<script src="assets/js/tarot-scenes.js"></script>
<script src="assets/js/tarot-images.js"></script>
<script src="assets/js/da-letter.js"></script>
<script src="assets/js/da-cloud-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="assets/js/da-auth.js"></script>
<script src="assets/js/da-mail.js"></script>
<script src="assets/js/incoming.js"></script>
</body>
</html>
